# **웹에서 난수를 어디서 받는지 적어 준다.**
#
# `getrandom` 0.3 은 wasm32-unknown-unknown 에서 기능 하나로는 모자라고 이
# `--cfg` 까지 받아야 브라우저의 `crypto.getRandomValues` 를 쓴다. 적지 않으면
# **컴파일이 선다** — 조용히 0 을 내놓는 쪽보다 낫다. 상자 파일에 적을 자리가
# 없어 여기 둔다.
#
# 데스크톱 빌드는 이 줄을 보지 않는다. 그 target 에만 건다.
# **웹에서 도는 시험을 무엇이 돌리는가.**
#
# wasm 은 그냥 실행할 수 없다. `cargo test --target wasm32-unknown-unknown` 이
# 구운 것을 이 도구가 받아 노드(또는 브라우저)에서 부른다. 없으면 받는다:
#
#     cargo install wasm-bindgen-cli --locked
#
# 판은 `wasm-bindgen` 크레이트와 **같아야** 한다. 어긋나면 도구가 그렇다고
# 말하고 선다 — 조용히 틀리지 않는다.
[target.wasm32-unknown-unknown]
runner = 'wasm-bindgen-test-runner'
rustflags = ['--cfg', 'getrandom_backend="wasm_js"']

# **윈도에서 시험이 돌게 하는 한 줄.**
#
# `wasm-bindgen-test-runner` 는 돌릴 JS(`run.cjs`)를 만들면서 벤치마크 기준값
# 파일의 경로를 작은따옴표 안에 **그대로** 박는다(0.2.129,
# `src/wasm_bindgen_test_runner/node.rs`). 윈도에서 그 경로는
# `C:\Users\...` 이고, JS 에서 `\U` 는 없는 이스케이프라 **노드가 그 파일을
# 읽지도 못하고 선다.**
#
#     SyntaxError: Invalid Unicode escape sequence
#
# 벤치마크를 돌리든 말든 선다. 쓰는 자리는 `if (is_bench)` 안이지만, 구문
# 오류는 그 앞에서 난다. 바로 옆 줄(`{coverage_temp_dir:?}`)은 `:?` 로 찍어
# 제대로 벗어나게 해 두었으니, 이 자리만 빠진 것이다.
#
# 그래서 그 경로를 우리가 정해 준다. 같은 파일이 읽는 환경 변수이고, 빗금이
# 없으니 박혀도 멀쩡하다. 리눅스에서는 원래 멀쩡했고 이 값으로도 멀쩡하다 —
# **고치는 사람만 서던 자리**라 러너에서는 드러나지 않았다.
#
# 거슬러 오르는 상대 경로다. `relative = true` 를 쓰면 cargo 가 윈도식 빗금으로
# 만들어 주어 **같은 자리로 되돌아간다.** 이 저장소는 벤치마크를 돌리지 않고,
# 읽는 쪽은 try/catch 안이라 없으면 그냥 넘어간다.
[env]
WASM_BINDGEN_BENCH_RESULT = "target/wbg_benchmark.json"
