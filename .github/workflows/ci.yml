# **관문 둘이 한 파일에 있다.**
#
# `gate` 는 커밋 전에 이 컴퓨터에서 돌리는 것과 같은 줄이다. `wasm` 은 여기서
# 돌리지 못하는 둘째 관문이다 — wasm 으로 구우려면 SQLite 의 C 소스를 컴파일할
# clang 이 있어야 하고(`rusqlite` 를 `bundled` 로 받는다), 러너 이미지에는 있다.
# 까닭과 깔고 가는 길은 `docs/wasm.md` 에 있다.
#
# **한 파일에 두는 까닭이 있다.** 관문을 파일 둘로 나누면 한쪽만 고쳐지고, 나가는
# 것과 평소 보는 것이 다른 줄을 지나게 된다. 무엇이 걸러지는지는 한 자리에서
# 읽을 수 있어야 한다. 잡을 둘로 가른 것은 **무엇이 막았는지 가려지지 않게**
# 하려는 것뿐이다.
#
# 공개 저장소라 러너 분이 무료다. 밀어 넣을 때마다 돌린다.
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # 데스크톱 관문. `CLAUDE.md` 가 말하는 그 둘이다.
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: Swatinem/rust-cache@v2
        with:
          key: gate

      - name: 시험
        run: cargo test --workspace

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  # **데스크톱이 볼 수 없는 자리.**
  #
  # `tests/wasm.rs` 들은 맨 위가 `#![cfg(target_arch = "wasm32")]` 라, 데스크톱에서
  # `cargo test --workspace` 를 돌리면 통째로 빈 파일이 된다. 공개 함수의 모양을
  # 바꾸고 그 파일의 부르는 자리를 안 고쳐도 첫째 관문은 초록불이다. 브라우저와
  # 주고받는 겹(`bindings.rs`)도 그 타깃에서만 컴파일되므로 마찬가지다.
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # SQLite 는 C 다. 이 줄이 없으면 이미지가 담아 둔 clang 에 기대게 되고,
      # 이미지가 바뀌는 날 까닭을 알기 어려운 자리에서 선다.
      - name: C 컴파일러
        run: sudo apt-get update && sudo apt-get install -y clang

      - name: wasm 타깃
        run: rustup target add wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm

      # **판을 손으로 적지 않는다.** `wasm-bindgen-cli` 의 판은 `wasm-bindgen`
      # 크레이트와 같아야 하고, 어긋나면 도구가 그렇다고 말하고 선다. 여기 숫자를
      # 적어 두면 크레이트를 올리는 날 이 파일만 낡는다 — 자물쇠 파일에서 읽는다.
      - name: wasm-bindgen 판
        id: bindgen
        run: |
          v=$(awk '$0=="name = \"wasm-bindgen\"" {f=1; next} f && /^version = / {gsub(/[",]/,"",$3); print $3; exit}' Cargo.lock)
          if [ -z "$v" ]; then
            echo "Cargo.lock 에서 wasm-bindgen 판을 찾지 못했습니다" >&2
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "wasm-bindgen $v"

      # 미리 구운 것을 받는다. `cargo install` 로 받으면 매번 몇 분을 굽는다.
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@${{ steps.bindgen.outputs.version }}

      # 껍질은 이 타깃에서만 컴파일된다. 데스크톱 clippy 는 그 파일을 보지 못한다.
      - name: clippy (껍질)
        run: cargo clippy -p sheetsift-web --all-targets --target wasm32-unknown-unknown -- -D warnings

      # `docs/wasm.md` 와 `CLAUDE.md` 에 적힌 그 두 줄이다. 돌리는 명령을 새로
      # 만들지 않는다.
      - name: 바탕
        run: cargo test -p sheetsift-core --target wasm32-unknown-unknown

      - name: 껍질
        run: cargo test -p sheetsift-web --target wasm32-unknown-unknown
