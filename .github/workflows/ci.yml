# Both gates live in this one file.
#
# `gate` runs the same lines you run locally before committing. `wasm` is the
# second gate, the one that cannot run on the author's machine: building for
# wasm compiles SQLite's C sources (`rusqlite` is taken with `bundled`), which
# needs clang, and the runner image has one. See `docs/wasm.md` for why, and
# for how to get it locally.
#
# `pages` deploys, and only after both gates pass (`needs`).
#
# Why one file: split the gates across two and one of them gets edited alone,
# so what ships and what you look at every day stop going through the same
# lines. What is checked -- and what must pass before anything ships -- should
# be readable in one place. The jobs are separate only so that a failure says
# which part failed.
#
# Triggers: what lands on `main`, what asks to be merged, and what you run by
# hand. The real gate is `cargo test --workspace` before the commit; what runs
# here is that plus the thing this machine cannot answer (wasm).
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # The desktop gate -- the two lines `CLAUDE.md` names.
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: Swatinem/rust-cache@v2
        with:
          key: gate

      - name: Tests
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  # What the desktop gate cannot see.
  #
  # The `tests/wasm.rs` files start with `#![cfg(target_arch = "wasm32")]`, so
  # `cargo test --workspace` on a desktop reads them as empty files. Change the
  # shape of a public function, leave those call sites alone, and the first gate
  # still goes green. The layer that talks to the browser (`bindings.rs`) is
  # compiled only for that target too, so the same holds for it.
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # SQLite is C. Without this line we would be leaning on whatever clang the
      # runner image happens to carry, and the day the image changes it breaks
      # somewhere far from the cause.
      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang

      - name: Add the wasm target
        run: rustup target add wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm

      # Do not write the version here. `wasm-bindgen-cli` must match the
      # `wasm-bindgen` crate -- when they differ the tool says so and stops.
      # A number written here would go stale the day the crate is bumped, so
      # read it from the lock file.
      - name: Read the wasm-bindgen version from Cargo.lock
        id: bindgen
        run: |
          v=$(awk '$0=="name = \"wasm-bindgen\"" {f=1; next} f && /^version = / {gsub(/[",]/,"",$3); print $3; exit}' Cargo.lock)
          if [ -z "$v" ]; then
            echo "could not find the wasm-bindgen version in Cargo.lock" >&2
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "wasm-bindgen $v"

      # Take the prebuilt one. `cargo install` would spend minutes every run.
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@${{ steps.bindgen.outputs.version }}

      # The shell compiles only for this target, so desktop clippy never sees it.
      - name: Clippy (the browser shell)
        run: cargo clippy -p sheetsift-web --all-targets --target wasm32-unknown-unknown -- -D warnings

      # The two lines written in `docs/wasm.md` and `CLAUDE.md`. No new commands.
      - name: Tests (core, wasm)
        run: cargo test -p sheetsift-core --target wasm32-unknown-unknown

      - name: Tests (web, wasm)
        run: cargo test -p sheetsift-web --target wasm32-unknown-unknown

  # Only what passed the gates ships.
  #
  # `needs` is what holds that. Written down as a rule it gets deleted one day,
  # and then a revision whose tests fail ships anyway. A test reads this file
  # and stops the first gate if the line goes missing
  # (`crates/web/tests/boundary.rs`).
  #
  # What ships is `web/`, which is a harness and not the product screen (see
  # `docs/web.md`) -- it exists to see the boundary actually run in a browser.
  # When the real screen arrives, only the folder this job points at changes.
  pages:
    needs: [gate, wasm]
    # A branch asking to be merged does not ship. Running it by hand means
    # "ship it", so that does.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    # Keep two runs from landing on the same place at once. Do not cancel one in
    # flight: if it is cut off, nobody knows what is actually deployed.
    concurrency:
      group: pages
      cancel-in-progress: false

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v5

      # Building needs the C compiler too, for the same reason as the tests.
      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang

      - name: Add the wasm target
        run: rustup target add wasm32-unknown-unknown

      # Reuse what the `wasm` job warmed. Saving is that job's business -- two
      # jobs saving under one key overwrite each other.
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm
          save-if: false

      - name: Read the wasm-bindgen version from Cargo.lock
        id: bindgen
        run: |
          v=$(awk '$0=="name = \"wasm-bindgen\"" {f=1; next} f && /^version = / {gsub(/[",]/,"",$3); print $3; exit}' Cargo.lock)
          if [ -z "$v" ]; then
            echo "could not find the wasm-bindgen version in Cargo.lock" >&2
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "wasm-bindgen $v"

      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@${{ steps.bindgen.outputs.version }}

      # The two lines from `docs/wasm.md`. The built output (`web/pkg`) is not
      # kept in the repository, so it is made here -- keeping it would let the
      # source and the build drift apart.
      - name: Build the web harness
        run: |
          cargo build -p sheetsift-web --target wasm32-unknown-unknown --release
          wasm-bindgen --target web --no-typescript --out-dir web/pkg \
            target/wasm32-unknown-unknown/release/sheetsift_web.wasm

      # Check the build is actually there. If it is not, what ships is a blank
      # page -- and the deploy looks like a success.
      - name: Check what is about to ship
        run: |
          for f in web/index.html web/app.js web/pkg/sheetsift_web.js web/pkg/sheetsift_web_bg.wasm; do
            if [ ! -s "$f" ]; then
              echo "$f is missing or empty" >&2
              exit 1
            fi
          done
          ls -l web/pkg

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - id: deploy
        uses: actions/deploy-pages@v4
