# The gate runs here, and it is the same gate you run locally.
#
# Locally the whole thing is one command, `npm run ci`. That command is a
# sequence of parts -- `ci:gate`, `ci:wasm`, `ci:tauri`, `ci:web` -- and the
# jobs below run those same parts, one per job, so they can go at once. Nothing here spells a
# check out again; every job calls a script from `package.json`.
#
# That is the point. When a check was written out in both places, one copy got
# edited and the other did not, and from then on what shipped and what you
# looked at every day went through different lines. So the parts live in
# `package.json` and this file only says which part runs where.
#
# `crates/shell/tests/gate.rs` holds the two together: every part must run here,
# and `npm run ci` must be all of the parts. Add a part and forget this file,
# or add a job here that runs something no part contains, and the gate stops.
#
# Why jobs at all, rather than one job running `npm run ci`: they go in
# parallel, and a failure says which part failed without opening the log.
#
# `wasm` is the part that cannot run on the author's machine -- building for
# wasm compiles SQLite's C sources (`rusqlite` is taken with `bundled`), which
# needs clang, and the runner image has one. See `docs/wasm.md`.
#
# `tauri` is the desktop shell. That crate is outside the workspace -- it takes
# the operating system's webview, and inside the workspace the Linux `gate` job
# would need webkit to build something it never runs. It runs on Windows, which
# is what the app is built for.
#
# `pages` deploys and `bake` builds the desktop app, and both only after every
# gate job passes (`needs`). Baking is not a check -- folding the two together
# hides which one failed. `ship` takes what they produced and publishes it.
#
# Triggers. The gate runs on every branch push and on anything asking to be
# merged: a check that waits for a pull request is a check you work without.
# Releasing is a separate trigger -- **pushing a tag** is the one manual act
# that says "this revision goes out", and the tag pattern takes no `v` prefix
# because the tags in this repository are plain versions (`0.0.0`).
# Running the workflow by hand deploys the screen and bakes the app without
# publishing anything, which is how the bundling config gets exercised without
# spending a tag on it.
name: ci

on:
  push:
    # Every branch, slash-separated names included.
    branches: ['**']
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One run per branch; a newer push cancels the older run.
#
# **The branch's short name, not the event, and not `github.ref`.** A push to a
# branch that has a pull request open fires twice -- once as `push`, once as
# `pull_request` -- and the two name the branch differently: on a pull request
# `github.ref` is `refs/pull/N/merge` and `head_ref` is the branch, while on a
# push `head_ref` is **empty** and `github.ref` is `refs/heads/<branch>`. So
# `head_ref || ref_name` is what makes both say `<branch>` and collapse into one
# run. `head_ref || ref` does not -- the two strings differ, neither cancels the
# other, and **the whole gate runs twice on every push**, Windows included.
#
# **What goes out is never cancelled.** A tag run and a run started by hand each
# get a group of their own (`run_id` is unique per run): those two are what is
# published, and cutting one off halfway leaves nobody knowing what is actually
# out there.
concurrency:
  group: ${{ github.workflow }}-${{ (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') && github.run_id || github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # The desktop part. What the author runs before every commit.
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: Swatinem/rust-cache@v2
        with:
          key: gate

      - run: npm run ci:gate

  # What the desktop part cannot see.
  #
  # The `tests/wasm.rs` files start with `#![cfg(target_arch = "wasm32")]`, so
  # `cargo test --workspace` on a desktop reads them as empty files. Change the
  # shape of a public function, leave those call sites alone, and `ci:gate`
  # still goes green. The layer that talks to the browser (`bindings.rs`) is
  # compiled only for that target too, so the same holds for it.
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # SQLite is C. Without this line we would be leaning on whatever clang the
      # runner image happens to carry, and the day the image changes it breaks
      # somewhere far from the cause.
      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang

      - name: Add the wasm target
        run: rustup target add wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm

      # Do not write the version here. `wasm-bindgen-cli` must match the
      # `wasm-bindgen` crate -- when they differ the tool says so and stops.
      # A number written here would go stale the day the crate is bumped, so
      # read it from the lock file.
      - name: Read the wasm-bindgen version from Cargo.lock
        id: bindgen
        run: |
          v=$(awk '$0=="name = \"wasm-bindgen\"" {f=1; next} f && /^version = / {gsub(/[",]/,"",$3); print $3; exit}' Cargo.lock)
          if [ -z "$v" ]; then
            echo "could not find the wasm-bindgen version in Cargo.lock" >&2
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "wasm-bindgen $v"

      # Take the prebuilt one. `cargo install` would spend minutes every run.
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@${{ steps.bindgen.outputs.version }}

      # Clippy on the shell is in here too: it compiles only for this target,
      # so the desktop part never sees it.
      - run: npm run ci:wasm

  # The screen. `vue-tsc` is the only thing that reads it against the shape
  # written in `web/src/pkg.d.ts`, and it needs no wasm and no clang -- so it
  # is its own part and runs beside the others.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm run ci:web

  # The desktop shell. Outside the workspace, so the part above never sees it.
  tauri:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: Swatinem/rust-cache@v2
        with:
          key: tauri
          workspaces: crates/tauri

      - run: npm run ci:tauri

  # Only what passed the gates ships.
  #
  # `needs` is what holds that. Written down as a rule it gets deleted one day,
  # and then a revision whose tests fail ships anyway. A test reads this file
  # and stops the first gate if the line goes missing
  # (`crates/shell/tests/gate.rs`).
  #
  # What ships is the screen in `web/`, a Vite + Vue app (see `docs/web.md`).
  # Vite writes it to `web/dist`, and that folder is what goes up -- not `web/`
  # itself, which holds the sources and `node_modules`.
  #
  # The wasm layer is built first, into `web/pkg`. Vite reaches it through the
  # `sheetsift-wasm` alias in `web/vite.config.ts`.
  pages:
    needs: [gate, wasm, tauri, web]
    # A tag is what goes out. Running it by hand also deploys -- that is the
    # only way to look at a change on a machine that cannot compile wasm
    # locally (`docs/web.md`), so it stays.
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    # Keep two runs from landing on the same place at once. Do not cancel one in
    # flight: if it is cut off, nobody knows what is actually deployed.
    concurrency:
      group: pages
      cancel-in-progress: false

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v7

      # Building needs the C compiler too, for the same reason as the tests.
      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang

      - name: Add the wasm target
        run: rustup target add wasm32-unknown-unknown

      # Reuse what the `wasm` job warmed. Saving is that job's business -- two
      # jobs saving under one key overwrite each other.
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm
          save-if: false

      - name: Read the wasm-bindgen version from Cargo.lock
        id: bindgen
        run: |
          v=$(awk '$0=="name = \"wasm-bindgen\"" {f=1; next} f && /^version = / {gsub(/[",]/,"",$3); print $3; exit}' Cargo.lock)
          if [ -z "$v" ]; then
            echo "could not find the wasm-bindgen version in Cargo.lock" >&2
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "wasm-bindgen $v"

      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@${{ steps.bindgen.outputs.version }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install the screen's dependencies
        working-directory: web
        run: npm ci

      # `npm run pkg` is the one command that builds the wasm layer; it lives
      # in `package.json` so this file and `docs/wasm.md` cannot drift apart.
      # The built output (`web/pkg`) is not kept in the repository -- keeping
      # it would let the source and the build drift apart.
      - name: Build the wasm layer
        run: npm run pkg

      # `npm run build` type-checks (`vue-tsc`) and then bundles. That type
      # check is the only thing that reads the screen against the shape written
      # in `web/src/pkg.d.ts`, so a break there stops the deploy instead of
      # shipping a page that fails in the browser.
      - name: Build the screen
        working-directory: web
        run: npm run build

      # Check the build is actually there. If it is not, what ships is a blank
      # page -- and the deploy looks like a success.
      - name: Check what is about to ship
        run: |
          for f in web/dist/index.html web/pkg/sheetsift_wasm.js web/pkg/sheetsift_wasm_bg.wasm; do
            if [ ! -s "$f" ]; then
              echo "$f is missing or empty" >&2
              exit 1
            fi
          done
          # The wasm has to have been carried into the bundle. Without it the
          # page loads and then does nothing, and nothing here would say so.
          if ! ls web/dist/assets/*.wasm >/dev/null 2>&1; then
            echo "no wasm in web/dist/assets -- the page would load and do nothing" >&2
            exit 1
          fi
          ls -lR web/dist

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

      - id: deploy
        uses: actions/deploy-pages@v5

  # Baking the desktop app. **Not a check.** It waits for the gate the same way
  # the deploy does, and it runs no test of its own -- when a build and a check
  # share one command, a red line does not say which of the two broke, and the
  # same command cannot be carried to a second operating system.
  #
  # Two operating systems, one job. A second job would have to be excluded from
  # the gate by name in `crates/shell/tests/gate.rs`; a leg of a matrix does
  # not. `fail-fast` is off so the leg that did build is still there to look at
  # -- but `ship` waits for the whole job, so one failed leg publishes nothing.
  # A release missing an operating system is worse than a release that is late.
  #
  # **The bundles are named, not `all`.** `tauri.conf.json` says `all` for
  # whoever bakes on their own machine; what goes out is one installer per
  # operating system, and the flag on the command line overrides that file.
  # Windows is baked a second time with `--no-bundle`, which stops after the
  # executable -- that is the no-install edition.
  #
  # The screen is built in `--mode tauri`, so `web/src/lib/book.tauri.ts` is the
  # boundary and no wasm is involved. `beforeBuildCommand` in `tauri.conf.json`
  # does that -- it is not spelled out here, and it runs once per bake.
  #
  # **A green leg does not say the app opens.** The Mac bundle above all: it is
  # unsigned and nobody here can start it. See `docs/desktop.md`.
  bake:
    needs: [gate, wasm, tauri, web]
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows
            bundles: nsis
            # Windows takes the runner's own target, so nothing to add.
            targets: ''
            extra: ''
            bundle_dir: target/release/bundle/nsis
          - os: macos-latest
            label: macos
            bundles: dmg
            # The runner is Apple silicon. Intel Macs are served by building
            # for both and letting `universal` hold the two.
            targets: 'aarch64-apple-darwin x86_64-apple-darwin'
            extra: '--target universal-apple-darwin'
            bundle_dir: target/universal-apple-darwin/release/bundle/dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Add the targets this leg builds for
        if: matrix.targets != ''
        run: rustup target add ${{ matrix.targets }}

      # A key of its own per leg. `rust-cache` puts the operating system in the
      # key anyway, so the gate's Windows cache would never be found here.
      - uses: Swatinem/rust-cache@v2
        with:
          key: bake-${{ matrix.label }}
          workspaces: crates/tauri

      - name: Install the screen's dependencies
        working-directory: web
        run: npm ci

      # **Through the `bake` script, not the tool.** The tool's version is
      # pinned, and it is pinned in `package.json` -- an unpinned tool changes
      # under you on a day you changed nothing, and a version written here as
      # well would be a second copy of the one that matters, with the local
      # entrance left on whatever it said before.
      #
      # One build per leg. The bundling step leaves the bare executable in
      # `target/release` on the way past, so the no-install edition costs
      # nothing extra -- a second build with `--no-bundle` would recompile
      # nothing and rebuild the screen again.
      - name: Bake
        run: npm run bake -- --bundles ${{ matrix.bundles }} ${{ matrix.extra }}

      # Read, never written. `tauri.conf.json` is the one place the version
      # lives, and every file name below is built out of it.
      - name: Read the version
        id: v
        shell: bash
        run: |
          version=$(node -p "require('./crates/tauri/tauri.conf.json').version")
          if [ -z "$version" ]; then
            echo "could not read the version out of crates/tauri/tauri.conf.json" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "version $version"

      # Name the file after the version and put it in a zip. Both, so neither
      # the file sitting in a downloads folder nor the one inside the archive
      # leaves the person guessing which build they have.
      #
      # A zip of the wrong thing is still a zip, so count what went in.
      - name: Stage what goes out (Windows)
        if: matrix.label == 'windows'
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          function Confirm-Zip($p) {
            $z = [IO.Compression.ZipFile]::OpenRead((Resolve-Path $p))
            $n = $z.Entries.Count
            $z.Dispose()
            if ($n -lt 1) { Write-Error "$p holds nothing"; exit 1 }
            Write-Host "$p -- $n file(s)"
          }
          $version = "${{ steps.v.outputs.version }}"
          New-Item -ItemType Directory -Force dist | Out-Null
          New-Item -ItemType Directory -Force stage | Out-Null

          $setup = Get-ChildItem "crates/tauri/${{ matrix.bundle_dir }}" -Filter *.exe |
                   Select-Object -First 1
          if (-not $setup) {
            Write-Error "no installer in crates/tauri/${{ matrix.bundle_dir }}"; exit 1
          }
          $setupZip = "dist/sheetsift-$version-windows-setup.zip"
          Compress-Archive -Path $setup.FullName -DestinationPath $setupZip
          Confirm-Zip $setupZip

          # **The bare executable is named after the crate, not after
          # `productName`** -- that name only reaches the bundle. Inside the zip
          # it is given the name a person expects to double-click.
          $exe = "crates/tauri/target/release/sheetsift-tauri.exe"
          if (-not (Test-Path $exe)) { Write-Error "$exe is missing"; exit 1 }
          Copy-Item $exe "stage/sheetsift.exe"
          $portableZip = "dist/sheetsift-$version-windows-portable.zip"
          Compress-Archive -Path "stage/sheetsift.exe" -DestinationPath $portableZip
          Confirm-Zip $portableZip

      # **The `.app` is not zipped.** It is a directory holding symbolic links,
      # and an archive of it arrives with those links flattened -- the app then
      # does not start, and nothing here would have said so. The dmg carries it
      # whole.
      - name: Stage what goes out (Mac)
        if: matrix.label == 'macos'
        shell: bash
        run: |
          version="${{ steps.v.outputs.version }}"
          mkdir -p dist
          dmg=$(ls crates/tauri/${{ matrix.bundle_dir }}/*.dmg 2>/dev/null | head -1)
          if [ -z "$dmg" ]; then
            echo "no dmg in crates/tauri/${{ matrix.bundle_dir }}" >&2
            exit 1
          fi
          # A dmg that is not a readable image is still a file of the right size.
          # This is the Windows side's "count what went into the zip", for the one
          # format that cannot be counted that way.
          if ! hdiutil imageinfo "$dmg" >/dev/null; then
            echo "$dmg is not a readable image" >&2
            exit 1
          fi
          cp "$dmg" "dist/sheetsift-$version-macos.dmg"

      # An empty file uploads fine and looks like a success.
      - name: Check what came out
        shell: bash
        run: |
          if [ -z "$(ls -A dist 2>/dev/null)" ]; then
            echo "dist is empty -- nothing was staged" >&2
            exit 1
          fi
          for f in dist/*; do
            if [ ! -s "$f" ]; then
              echo "$f is empty" >&2
              exit 1
            fi
          done
          ls -l dist

      # A name per leg. Two legs uploading under one name is an error, and the
      # run would stop here with nothing kept.
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.label }}
          path: dist
          if-no-files-found: error

  # Publishing. The only job that writes to the repository, and the only one a
  # tag alone starts.
  #
  # It waits for every gate job by name as well as for `bake`. Waiting through
  # `bake` would satisfy GitHub, but the check that holds this file to the gate
  # reads the line as text and cannot follow one job through another
  # (`crates/shell/tests/gate.rs`) -- so the line names all of them.
  #
  # **The release is a draft.** A green bake does not say the app opens, so a
  # person looks before it is public.
  ship:
    needs: [gate, wasm, tauri, web, bake]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    # Never two at once on one tag, and never cancel one in flight -- cut off
    # halfway, nobody knows what is attached to the release.
    concurrency:
      group: ship-${{ github.ref_name }}
      cancel-in-progress: false

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # **The tag and the version have to be the same string.** The version is
      # what every file name above was built out of. A tag that disagrees would
      # attach `0.0.0` files to a `0.1.0` release and nothing would say so, so
      # stop here instead.
      - name: Check the tag against the version
        run: |
          version=$(node -p "require('./crates/tauri/tauri.conf.json').version")
          tag="${{ github.ref_name }}"
          if [ "$version" != "$tag" ]; then
            echo "the tag is $tag but crates/tauri/tauri.conf.json says $version" >&2
            echo "raise the version, commit it, and tag that commit" >&2
            exit 1
          fi
          echo "version $version"

      # The same major as the upload above. A mismatched pair downloads nothing
      # and succeeds.
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Check what is about to be published
        run: |
          if [ ! -d artifacts ] || [ -z "$(ls -A artifacts)" ]; then
            echo "artifacts is missing or empty" >&2
            exit 1
          fi
          # Every edition has to be there. A release quietly missing one is the
          # kind of gap nobody reports.
          for want in windows-setup windows-portable macos; do
            if ! ls artifacts/*"$want"* >/dev/null 2>&1; then
              echo "nothing for $want" >&2
              exit 1
            fi
          done
          ls -l artifacts

      # The wording lives in `.github/release-notes.md`, not here -- whoever
      # downloads it reads that, so it is worth reading before it goes out.
      # `{version}` is the only thing filled in.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ github.ref_name }}"
          sed "s/{version}/$tag/g" .github/release-notes.md > notes.md
          # A re-run of a half-finished publish must not stop on "it exists".
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" artifacts/* --clobber
          else
            gh release create "$tag" --title "$tag" --notes-file notes.md --draft artifacts/*
          fi
