# The gate, on everything that is being worked on.
#
# **One line of jobs, because the gate is defined in `gate.yml`.** Do not write
# steps out here: a second copy of the gate drifts from the first, and the one
# that drifts loose is whichever is read less often.
#
# Every branch, and anything asking to be merged -- a check that waits for a
# pull request is a check you work without. **Releasing is not here**; it is
# `publish.yml`, by hand, on a tag.
name: ci

on:
  push:
    # Slash-separated names included. **No `tags:`** -- a tag starts nothing;
    # releasing is something a person does (`publish.yml`).
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One run per branch; a newer push cancels the older one.
#
# **The branch's short name, not the event, and not `github.ref`.** A push to a
# branch that has a pull request open fires twice -- once as `push`, once as
# `pull_request` -- and the two name the branch differently: on a pull request
# `github.ref` is `refs/pull/N/merge` and `head_ref` is the branch, while on a
# push `head_ref` is **empty** and `github.ref` is `refs/heads/<branch>`. So
# `head_ref || ref_name` is what makes both say `<branch>` and collapse into one
# run. `head_ref || ref` does not -- the two strings differ, neither cancels the
# other, and **the whole gate runs twice on every push**, Windows included.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  gate:
    name: Gate
    uses: ./.github/workflows/gate.yml
