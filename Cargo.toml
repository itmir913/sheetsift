[workspace]
resolver = "2"
members = ["crates/aead", "crates/core", "crates/desk", "crates/shell", "crates/wasm"]
# **tauri 앱은 워크스페이스 외부다.** 그 상자가 운영체제의 webview 를 요구해,
# 수용하면 데스크톱과 무관한 조각(`ci:gate`)까지 그것을 요구하게 된다. 사유는
# `crates/tauri/Cargo.toml` 의 머리 주석에 소재한다.
exclude = ["crates/tauri"]

# 열쇠 도출과 암호만은 **시험에서도 최적화해 실행한다.**
#
# Argon2 는 64 MiB 를 3회 주사하는 작업이라 최적화를 해제하면 1회에 수초가
# 소요된다. 비용(메모리·횟수)은 동일하므로 **수호하는 강도는 변동하지 않는다** —
# 동일한 작업을 신속한 코드로 수행할 뿐이다.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

# 이 지정은 **그 상자 내부에서 컴파일되는 코드에만 작용한다.** AES-GCM 은
# 제네릭이라 부르는 곳에서 구체화되므로, 제네릭이 아닌 한 겹(sheetsift-aead)을
# 별도로 배치하고 거기에 부여한다. 사유는 crates/aead 의 머리 주석에 소재한다.
[profile.dev.package.sheetsift-aead]
opt-level = 3

[profile.dev.package.curve25519-dalek]
opt-level = 3
