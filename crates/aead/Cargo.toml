[package]
name = "sheetsift-aead"
# **여기는 판을 기재하는 곳이 아니다.** 앱의 판은 `tauri.conf.json` 하나이고,
# 상자의 판은 그것과 별개의 공간이라 전부 `0.0.0` 이다. 의존하는 곳은 판으로
# 수령하지 않고 git 참조(태그·rev)로 고정하므로, 여기 기재한 값은 어디에도
# 도달하지 않는다 — 두 곳에 기재하면 한쪽만 상승한다.
version = "0.0.0"
edition = "2021"
rust-version = "1.82"
# 공개 저장소이고 타 상자 전부와 동일하다. 수령하는 쪽이 라이선스를 집계할 때
# 이 상자만 미기재로 출현하는 것을 차단한다.
license = "MIT"
publish = false

[dependencies]
# zeroize 를 활성화하지 않으면 상자 내부의 **소거하는 코드가 전부 누락된다.**
# AES 라운드 열쇠에서 원래 열쇠는 역산할 수 있다.
aes-gcm = { version = "0.11", features = ["zeroize"] }
