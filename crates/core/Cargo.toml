[package]
name = "sheetsift-core"
# 여기는 판을 적는 곳이 아니다. 판은 이 크레이트를 쓰는 앱이 정한다.
version = "0.0.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
publish = false

# **tauri 도 파일 시스템도 모른다.** 바이트를 받고 바이트를 돌려준다 — 데스크톱과
# 웹(wasm)이 같은 코드를 쓰려면 그래야 한다. 열쇠도 여기 없다. 부르는 쪽이 넣는다.
[dependencies]
serde = { version = "1.0", features = ["derive"] }
rand = "0.9"
ed25519-dalek = { version = "2", default-features = false, features = ["std", "zeroize"] }
sheetsift-aead = { path = "../aead" }
# serialize: 봉한 알맹이를 임시 파일 없이 메모리에서 연다.
rusqlite = { version = "0.40", features = ["bundled", "serialize"] }
# `zeroize` 는 기본에 없다. 켜지 않으면 크레이트 안의 **지우는 코드가
# 컴파일에서 통째로 빠진다** — 64 MiB 짜리 Argon2 작업 메모리가 지워지지 않은
# 채 해제된다.
argon2 = { version = "0.6", features = ["zeroize"] }
# 비밀번호의 유니코드 표기를 한 가지로 맞춘다. 맥 자판이 내는 NFD 와
# 윈도우가 내는 NFC 는 **바이트가 달라** 같은 글자에서 다른 열쇠가 나온다.
unicode-normalization = "0.1"
zeroize = "1"

[dev-dependencies]
blake2 = "0.10"
