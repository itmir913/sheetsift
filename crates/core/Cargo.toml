[package]
name = "sheetsift-core"
# 여기는 판을 기재하는 곳이 아니다. 판은 이 상자를 사용하는 앱이 결정한다.
version = "0.0.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
publish = false

# **사용하지 않는 층은 도입하지 않는다.**
#
# 이 바탕을 사용하는 앱이 전부 동일한 작업을 수행하지는 않는다. 자료를 파일로
# 추출하지 않는 앱은 `.sift` 를 생성할 사안이 부재하고, 정의를 사람이 기재하는
# 앱은 구조를 식별할 사안이 부재하다.
#
# 코드가 감소하는 것이 요점이 아니다. **오류 코드가 단일 enum 이라서** 그렇다.
# 여기 코드를 하나 증가시키면 그것을 사용하지 않는 앱까지 사람이 판독할 문구를
# 한 행 기재해야 한다 — 영영 화면에 출현할 수 없는 문구다. 활성화하지 않은 층의
# 코드는 enum 에 애초에 부재한다.
#
# **기본은 전부 활성화한 것**이다. 이 저장소의 시험이 전부 작동해야 하고,
# 사용하는 곳이 아무것도 기재하지 않았을 때 기능이 묵시적으로 누락되는 쪽보다
# 양호하다. 축소하려는 앱이 `default-features = false` 로 기재해 선별한다.
[features]
default = ["sift", "infer"]
# `.sift` — 변환한 표를 파일로 수용하는 형식.
sift = ["dep:sha2"]
# 임의의 표에서 머리글과 열의 종류를 식별하는 층.
infer = []

# **tauri 도 파일 시스템도 인지하지 않는다.** 바이트를 수령하고 바이트를
# 반환한다 — 데스크톱과 웹(wasm)이 동일한 코드를 사용하려면 그래야 한다. 열쇠도
# 여기 부재한다. 부르는 곳이 주입한다.
[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.9"
ed25519-dalek = { version = "2", default-features = false, features = ["std", "zeroize"] }
sheetsift-aead = { path = "../aead" }
# serialize: 봉인한 알맹이를 임시 파일 없이 메모리에서 개방한다.
rusqlite = { version = "0.40", features = ["bundled", "serialize"] }
# `zeroize` 는 기본에 부재한다. 활성화하지 않으면 상자 내부의 **소거하는 코드가
# 컴파일에서 전부 누락된다** — 64 MiB 의 Argon2 작업 메모리가 소거되지 않은 채
# 해제된다.
argon2 = { version = "0.6", features = ["zeroize"] }
# 비밀번호의 유니코드 표기를 단일 형태로 정합한다. 맥 자판이 산출하는 NFD 와
# 윈도우가 산출하는 NFC 는 **바이트가 상이해** 동일한 문자에서 상이한 열쇠가
# 도출된다.
unicode-normalization = "0.1"
zeroize = "1"
# **시계는 운영체제의 것이라, wasm 에는 부재한다.**
#
# `std::time::Instant::now()` 는 wasm32-unknown-unknown 에서 컴파일은 정상
# 완료되고 **호출 즉시 패닉한다**("time not implemented on this platform").
# 문자로는 식별되지 않고 데스크톱 시험도 발견하지 못한다 — 웹에서 구동한 이후에
# 판별했다. 데스크톱에서는 그대로 `std` 를 사용하고, wasm 에서는 브라우저의
# `performance.now()` 를 사용한다.
web-time = "1"
# 수용하는 표. xlsx 는 zip 내부의 XML 이고, csv 는 문자다.
calamine = "0.36"
csv = "1"
# **csv 의 문자 표기를 판별한다.** 국내의 csv 는 UTF-8 이 아니면 대개 CP949 다.
# encoding_rs 의 `EUC_KR` 이 그 표(windows-949)다.
encoding_rs = "0.8"
# 원본의 지문. sha256 인 사유는 사람이 `sha256sum` 으로 독자적으로 대조할 수
# 있어서다. `.sift` 만 사용하므로 그 기능과 함께 도입된다.
sha2 = { version = "0.10", optional = true }

[dev-dependencies]
blake2 = "0.10"


# **웹에서는 난수를 브라우저에서 수령해야 한다.**
#
# `getrandom` 은 wasm32-unknown-unknown 에서 기본으로 아무 자리도 선정하지 않고
# **컴파일을 중단한다** — 묵시적으로 0 을 산출하는 쪽보다 양호하다. 브라우저의
# `crypto.getRandomValues` 를 사용하라고 기재한다. 데스크톱에서는 이 행이
# 부재한 것과 동일하다.
# 판이 둘인 것은 이쪽의 사정이 아니다. `rand` 가 0.3 을, 사용하는 타 상자가
# 0.4 를 도입한다. **양자를 전부 기재해야** 한다 — 일방만 기재하면 잔여 하나가
# 재차 컴파일을 중단한다. 0.3 은 기능만으로 부족해 `--cfg` 까지 수령하므로 그
# 행은 `.cargo/config.toml` 에 소재한다.

# 웹에서 작동하는 시험. 시험 하나하나를 wasm 모듈의 내보내기로 구성해, 노드나
# 브라우저가 호출할 수 있게 한다. 데스크톱 시험은 이것을 사용하지 않는다.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom_04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
