[package]
name = "sheetsift-core"
# 여기는 판을 적는 곳이 아니다. 판은 이 크레이트를 쓰는 앱이 정한다.
version = "0.0.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
publish = false

# **tauri 도 파일 시스템도 모른다.** 바이트를 받고 바이트를 돌려준다 — 데스크톱과
# 웹(wasm)이 같은 코드를 쓰려면 그래야 한다. 열쇠도 여기 없다. 부르는 쪽이 넣는다.
[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.9"
ed25519-dalek = { version = "2", default-features = false, features = ["std", "zeroize"] }
sheetsift-aead = { path = "../aead" }
# serialize: 봉한 알맹이를 임시 파일 없이 메모리에서 연다.
rusqlite = { version = "0.40", features = ["bundled", "serialize"] }
# `zeroize` 는 기본에 없다. 켜지 않으면 크레이트 안의 **지우는 코드가
# 컴파일에서 통째로 빠진다** — 64 MiB 짜리 Argon2 작업 메모리가 지워지지 않은
# 채 해제된다.
argon2 = { version = "0.6", features = ["zeroize"] }
# 비밀번호의 유니코드 표기를 한 가지로 맞춘다. 맥 자판이 내는 NFD 와
# 윈도우가 내는 NFC 는 **바이트가 달라** 같은 글자에서 다른 열쇠가 나온다.
unicode-normalization = "0.1"
zeroize = "1"
# **시계는 운영체제의 것이라, wasm 에는 없다.**
#
# `std::time::Instant::now()` 는 wasm32-unknown-unknown 에서 컴파일은 멀쩡히
# 되고 **부르는 순간 패닉한다**("time not implemented on this platform").
# 글자로는 보이지 않고 데스크톱 시험도 보지 못한다 — 웹에서 돌려 보고서야
# 알았다. 데스크톱에서는 그대로 `std` 를 쓰고, wasm 에서는 브라우저의
# `performance.now()` 를 쓴다.
web-time = "1"

[dev-dependencies]
blake2 = "0.10"


# **웹에서는 난수를 브라우저에서 받아야 한다.**
#
# `getrandom` 은 wasm32-unknown-unknown 에서 기본으로 아무 자리도 고르지 않고
# **컴파일을 세운다** — 조용히 0 을 내놓는 쪽보다 낫다. 브라우저의
# `crypto.getRandomValues` 를 쓰라고 적어 준다. 데스크톱에서는 이 줄이 없는
# 것과 같다.
# 판이 둘인 것은 우리 사정이 아니다. `rand` 가 0.3 을, 우리가 쓰는 다른 상자가
# 0.4 를 들인다. **둘 다 적어 주어야** 한다 — 하나만 적으면 나머지 하나가 다시
# 컴파일을 세운다. 0.3 은 기능만으로 모자라 `--cfg` 까지 받으므로 그 줄은
# `.cargo/config.toml` 에 있다.

# 웹에서 도는 시험. 시험 하나하나를 wasm 모듈의 내보내기로 만들어, 노드나
# 브라우저가 부를 수 있게 한다. 데스크톱 시험은 이것을 쓰지 않는다.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom_04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
