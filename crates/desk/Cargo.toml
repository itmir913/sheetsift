[package]
name = "sheetsift-desk"
# 여기는 판을 기재하는 곳이 아니다. 판은 이 상자를 굽는 곳이 결정한다.
version = "0.0.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
publish = false

# **창이 호출하는 명령과, 파일을 판독하고 기록하는 작업.**
#
# 알맹이는 `sheetsift-shell` 에 소재하고 이 상자는 그것을 수령한다. 여기 소재
# 하는 것은 창이 호출하는 명령과, **파일을 판독하고 기록하는 작업**뿐이다 —
# `sheetsift-core` 가 수행하지 않는 유일한 작업이 그것이다.
#
# **`tauri` 를 여기서 수령하지 않는다.** 여기 소재하는 것이 통상 Rust 라
# `cargo test --workspace` 가 전부 판정한다. `#[tauri::command]` 와 창은
# `crates/tauri` 가 담당하고, 그것은 워크스페이스 외부다 — 그 상자를 여기 수용
# 하면 리눅스 러너의 `ci:gate` 가 webkit 을 요구하게 된다.
[dependencies]
sheetsift-shell = { path = "../shell" }
sheetsift-core = { path = "../core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
