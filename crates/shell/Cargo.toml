[package]
name = "sheetsift-shell"
# 여기는 판을 기재하는 곳이 아니다. 판은 이 상자를 굽는 곳이 결정한다.
version = "0.0.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
publish = false

# **알맹이는 플랫폼을 인지하지 않는다.**
#
# 여기 소재하는 것은 변환한 연결과 열 정의와 요청을 단일 위치에 결속하는
# `Viewer` 뿐이고, 통상 Rust 라 `cargo test --workspace` 가 데스크톱에서 전부
# 판정한다. 브라우저와 수수하는 겹은 `sheetsift-wasm`, 데스크톱 창과 수수하는
# 겹은 그쪽 껍질이 담당한다 — **그것들이 이 상자를 수령하고, 이 상자는
# 그것들을 인지하지 않는다.**
[dependencies]
sheetsift-core = { path = "../core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
