[package]
name = "sheetsift-web"
# 여기는 판을 적는 곳이 아니다. 판은 이 상자를 굽는 쪽이 정한다.
version = "0.0.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
publish = false

# `cdylib` 는 wasm 으로 구울 때 필요하고, `rlib` 는 **데스크톱에서 시험을
# 돌리려고** 둔다. 알맹이는 보통 Rust 라 거기서 거의 다 볼 수 있다.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
sheetsift-core = { path = "../core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# **브라우저와 주고받는 겹.** 알맹이는 이것을 모른다 — `bindings.rs` 하나만 안다.
wasm-bindgen = "0.2"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
