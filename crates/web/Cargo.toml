[package]
name = "sheetsift-web"
# 여기는 판을 기재하는 곳이 아니다. 판은 이 상자를 굽는 곳이 결정한다.
version = "0.0.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
publish = false

# `cdylib` 는 wasm 으로 굽는 데 필요하고, `rlib` 는 **데스크톱에서 시험을
# 실행하려고** 배치한다. 알맹이는 통상 Rust 라 거기서 대부분 판정할 수 있다.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
sheetsift-core = { path = "../core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# **브라우저와 수수하는 겹.** 알맹이는 이것을 인지하지 않는다 — `bindings.rs`
# 단일 파일만 인지한다.
wasm-bindgen = "0.2"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
