[package]
name = "sheetsift-webview"
# 여기는 판을 기재하는 곳이 아니다. 판은 이 상자를 사용하는 앱이 결정한다.
version = "0.0.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
publish = false

# **창의 webview 가 독자 보유한 단축키를 비활성화한다.**
#
# 이 저장소의 앱은 사용하지 않는다. 사용하는 앱(goe-navi)이 git 의존으로
# 수령한다 — 워크스페이스 외부의 상자도 패키지 명칭으로 탐색된다.
#
# **워크스페이스 외부다.** `tauri` 를 수령하므로 `crates/tauri` 와 동일한 사유로
# 분리한다 — 수용하면 `ci:gate` 가 운영체제의 webview 를 요구하게 된다. 이 상자는
# `ci:webview` 가 담당한다.
[workspace]

[dependencies]
tauri = { version = "2", features = [] }

# **tauri 가 사용하는 것과 동일한 판이어야 한다.** 상이하면 동일 명칭의 상이한
# 타입이 되어 컴파일이 중단된다. tauri 의 판을 상승시키면 이 둘도 추종한다 —
# 잠금 파일에 판이 둘 존재하면 `tests/lock.rs` 가 정지한다.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = "0.62"
